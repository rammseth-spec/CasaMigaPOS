name: CodeQL

# Sólo a mano (pedido del dueño, 22/10/2026): no corre en cada cambio. Se lanza desde Actions → Run workflow.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source exists
        shell: pwsh
        run: |
          if (-not (Test-Path "src")) {
            Write-Error "Source tree has not been imported into GitHub yet."
            exit 1
          }

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        shell: pwsh
        run: dotnet build CasaMigaPOS.slnx -c Release --nologo

      # El repo es privado de una cuenta personal: GitHub no permite activar el escaneo de código (requiere plan de pago),
      # así que los resultados no se suben a la pestaña de seguridad. Se guardan como artefacto y el resumen da el conteo.
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: codeql-results

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: codeql-results
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $count = 0
          foreach ($file in Get-ChildItem codeql-results -Filter *.sarif -ErrorAction SilentlyContinue) {
            $sarif = Get-Content $file.FullName -Raw | ConvertFrom-Json
            foreach ($run in $sarif.runs) { if ($run.results) { $count += $run.results.Count } }
          }
          "### CodeQL`n`nHallazgos: **$count**. Reporte completo: artefacto ``codeql-results`` de esta corrida." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
