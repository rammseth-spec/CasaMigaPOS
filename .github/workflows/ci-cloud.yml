name: Casa Miga web CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - ".github/workflows/ci-cloud.yml"
  pull_request:
    branches: [main]
    paths:
      - "cloud/**"
      - ".github/workflows/ci-cloud.yml"

permissions:
  contents: read

concurrency:
  group: casamiga-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloud

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and API tests
        run: npm test

      - name: Browser tests
        run: npm run test:browser
