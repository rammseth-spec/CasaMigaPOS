name: Casa Miga POS CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "migrations/**"
      - "scripts/**"
      - "*.slnx"
      - "Directory.Build.props"
      - "global.json"
      - "NuGet.Config"
      - "cloud/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "migrations/**"
      - "scripts/**"
      - "*.slnx"
      - "Directory.Build.props"
      - "global.json"
      - "NuGet.Config"
      - "cloud/**"

permissions:
  contents: read

concurrency:
  group: casamiga-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository completeness
        shell: pwsh
        run: |
          $required = @(
            "src",
            "tests",
            "migrations",
            "scripts/verify.ps1",
            "CasaMigaPOS.slnx",
            "global.json"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing.Count -gt 0) {
            Write-Error ("Repository is incomplete. Missing: " + ($missing -join ", "))
            exit 1
          }

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # La prueba de punta a punta (CloudEndToEndTests) levanta la nube local con Node; sin estas dependencias se omite.
      - name: Setup Node.js for the end-to-end test
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Install web dependencies
        working-directory: cloud
        run: npm ci

      - name: Run canonical verification
        shell: pwsh
        run: ./scripts/verify.ps1

      # Cada prueba fallida sale como anotación (y en el resumen), así el correo de GitHub ya dice cuál fue.
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          $failed = @()
          foreach ($file in Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue) {
            [xml]$trx = Get-Content -LiteralPath $file.FullName -Raw
            foreach ($result in @($trx.TestRun.Results.UnitTestResult) | Where-Object { $_.outcome -eq 'Failed' }) {
              $message = (("" + $result.Output.ErrorInfo.Message) -replace "\s+", " ").Trim()
              if ($message.Length -gt 400) { $message = $message.Substring(0, 400) + "…" }
              $failed += [pscustomobject]@{ Name = $result.testName; Message = $message }
            }
          }
          if ($failed.Count -eq 0) { Write-Output "::error title=Verificación::Falló antes de las pruebas (restore o compilación); revisa el paso anterior."; exit 0 }
          foreach ($test in $failed | Select-Object -First 10) { Write-Output "::error title=Prueba fallida: $($test.Name)::$($test.Message)" }
          "## Pruebas fallidas ($($failed.Count))" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          foreach ($test in $failed) { "- **$($test.Name)**: $($test.Message)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casamiga-verification-${{ github.sha }}
          path: |
            TestResults/**
            artifacts/**
          if-no-files-found: ignore
          retention-days: 14
