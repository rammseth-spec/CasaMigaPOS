<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F5F3EF">
<title>Casa Miga en línea</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<main id="login" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="on">
    <img src="logo.png" alt="Casa Miga Panadería">
    <h1>Casa Miga en línea</h1>
    <p class="muted">Entra con tu usuario y contraseña de la caja.</p>
    <label class="field">Usuario<input id="username" name="username" autocomplete="username" required maxlength="80" autocapitalize="none" spellcheck="false"></label>
    <label class="field">Contraseña<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200"></label>
    <button type="submit" class="primary">Entrar</button>
    <p id="login-error" class="error" role="alert"></p>
    <p class="muted small">Encargados ven su sucursal; el administrador, todas. Los cajeros usan sólo la caja.</p>
  </form>
</main>

<div id="app" class="shell" hidden>
  <nav class="nav" id="nav" aria-label="Secciones">
    <div class="brand"><img src="logo.png" alt="Casa Miga"></div>
    <div id="nav-links"></div>
    <div class="spacer"></div>
    <div class="who"><strong id="who-name"></strong><span id="who-role" class="muted"></span>
      <button id="logout" class="ghost" type="button">Salir</button></div>
  </nav>
  <div class="main">
    <header class="topbar">
      <button class="icon ghost menu" id="menu" type="button" aria-label="Menú" aria-controls="nav">☰</button>
      <div class="title"><h1 id="view-title"></h1><span id="view-subtitle"></span></div>
      <button class="ghost refresh" id="refresh" type="button" aria-label="Actualizar ahora"><span id="updated">Actualizar</span></button>
      <div class="filters" id="filters">
        <div class="chips" role="group" aria-label="Periodo" id="periods"></div>
        <div class="dates" id="dates"><input id="from" type="date" aria-label="Desde"><span>a</span><input id="to" type="date" aria-label="Hasta"></div>
        <select id="branch" aria-label="Sucursal"></select>
      </div>
    </header>
    <p id="error" class="banner" role="alert" hidden></p>
    <section class="content" id="view" aria-live="polite"></section>
  </div>
</div>
</body>
</html>
